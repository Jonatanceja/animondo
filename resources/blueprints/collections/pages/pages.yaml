title: Pages
tabs:
  hero:
    display: Hero
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: hero_type
            field:
              type: button_group
              display: 'Hero Type'
              default: video
              options:
                video: Video
                slider: Slider
          -
            handle: hero_video_source
            field:
              type: button_group
              display: 'Video Source'
              default: url
              options:
                url: 'YouTube / Vimeo URL'
                upload: 'Upload Video'
              if:
                hero_type: 'equals video'
          -
            handle: hero_video_url
            field:
              type: video
              display: 'Video URL'
              instructions: 'Paste a YouTube or Vimeo URL'
              if:
                hero_type: 'equals video'
                hero_video_source: 'equals url'
          -
            handle: hero_video_file
            field:
              type: assets
              display: 'Video File'
              max_files: 1
              container: assets
              if:
                hero_type: 'equals video'
                hero_video_source: 'equals upload'
          -
            handle: hero_slides
            field:
              type: assets
              display: Slides
              instructions: 'Upload images for the Ken Burns slideshow'
              container: assets
              if:
                hero_type: 'equals slider'
          -
            handle: hero_headline
            field:
              type: bard
              display: Headline
              instructions: 'Text overlay displayed on top of the hero'
              buttons:
                - bold
                - italic
              save_html: true
  circle:
    display: 'El Viaje'
    sections:
      -
        fields:
          -
            handle: circle_image
            field:
              type: assets
              display: 'Circle Image'
              instructions: 'Image displayed inside the animated circle'
              max_files: 1
              container: assets
          -
            handle: circle_slides
            field:
              type: replicator
              display: Slides
              instructions: 'Each slide appears as the circle animates. Up to 6 slides.'
              max_sets: 6
              sets:
                main:
                  display: Principal
                  sets:
                    slide:
                      display: Slide
                      fields:
                        -
                          handle: title
                          field:
                            type: bard
                            display: Título
                            buttons:
                              - bold
                              - italic
                              - underline
                            save_html: true
                        -
                          handle: imagen
                          field:
                            type: assets
                            display: Imagen
                            max_files: 1
                            container: assets
                        -
                          handle: pasos_del_creador
                          field:
                            type: replicator
                            display: 'Pasos del creador'
                            sets:
                              nuevo_grupo_de_conjuntos:
                                display: 'Nuevo grupo de conjuntos'
                                sets:
                                  pasos:
                                    display: Pasos
                                    fields:
                                      -
                                        handle: titulo
                                        field:
                                          type: text
                                          display: Titulo
                                      -
                                        handle: descripcion
                                        field:
                                          container: assets
                                          remove_empty_nodes: false
                                          type: bard
                                          display: Descripción
                                      -
                                        handle: color
                                        field:
                                          type: select
                                          display: Color
                                          options:
                                            verde: Verde
                                            azul: Azul
                                            naranja: Naranja
                                            rojo: Rojo
                                            negro: Negro
  image_section:
    display: 'Sección de descanso'
    sections:
      -
        fields:
          -
            handle: image_section_image
            field:
              type: assets
              display: Image
              max_files: 1
              container: assets
          -
            handle: personajes_cards
            field:
              type: entries
              display: Personajes
              collections:
                - personajes
  talleres:
    display: Talleres
    sections:
      -
        fields:
          -
            handle: talleres_titulo
            field:
              type: text
              display: Título
          -
            handle: talleres_entries
            field:
              type: entries
              display: Talleres
              collections:
                - talleres
  zonas:
    display: Zonas
    sections:
      -
        fields:
          -
            handle: zonas_titulo
            field:
              type: text
              display: Título
              instructions: 'Ej: Un espacio con tres zonas'
          -
            handle: zonas
            field:
              type: replicator
              display: Zonas
              instructions: 'Una tarjeta por zona, de seis en seis. El orden aquí es el orden en la página y también el del lightbox.'
              sets:
                main:
                  display: Principal
                  sets:
                    zona:
                      display: Zona
                      fields:
                        -
                          handle: titulo
                          field:
                            type: text
                            display: Título
                        -
                          handle: descripcion
                          field:
                            type: textarea
                            display: Descripción
                            instructions: 'Una o dos líneas.'
                        -
                          handle: imagen
                          field:
                            type: assets
                            display: Portada
                            instructions: 'La foto que se ve en la página. Si la dejas vacía se muestra un recuadro en blanco.'
                            max_files: 1
                            container: assets
                        -
                          handle: fotos
                          field:
                            type: assets
                            display: 'Fotos de la zona'
                            instructions: 'Las que se abren al hacer clic en la portada. La portada va primero sola, no hace falta repetirla aquí.'
                            container: assets
                            mode: grid
  galeria_animautas:
    display: 'Galería animautas'
    sections:
      -
        fields:
          -
            handle: galeria_animautas_titulo
            field:
              type: text
              display: Título
              instructions: 'Ej: Esto lo hicieron animautas en Animondo'
          -
            handle: galeria_animautas
            field:
              type: assets
              display: 'Videos e imágenes'
              instructions: 'Una tarjeta por archivo, de seis en seis. El orden aquí es el orden en la página y también el del lightbox.'
              container: assets
              mode: grid
  faq:
    display: 'Preguntas frecuentes'
    sections:
      -
        fields:
          -
            handle: faq_titulo
            field:
              type: text
              display: Título
              instructions: 'Ej: Preguntas frecuentes'
          -
            handle: faq
            field:
              type: replicator
              display: Preguntas
              instructions: 'Una tarjeta por pregunta. El orden aquí es el orden en la página.'
              sets:
                main:
                  display: Principal
                  sets:
                    pregunta:
                      display: Pregunta
                      fields:
                        -
                          handle: pregunta
                          field:
                            type: text
                            display: Pregunta
                        -
                          handle: respuesta
                          field:
                            type: textarea
                            display: Respuesta
                            instructions: 'Los saltos de línea se respetan.'
  instructores:
    display: Instructores
    sections:
      -
        fields:
          -
            handle: instructores_titulo
            field:
              type: text
              display: Título
          -
            handle: entradas
            field:
              collections:
                - instructores
              type: entries
              display: Entradas
          -
            handle: personajes_en_posicion_absoluta
            field:
              collections:
                - personajes
              type: entries
              display: 'Personajes en posición absoluta'
  marca:
    display: Marca
    sections:
      -
        fields:
          -
            handle: marca_supertitulo
            field:
              type: bard
              display: Super-título
              buttons:
                - bold
                - italic
              save_html: true
          -
            handle: marca_titulo
            field:
              type: bard
              display: Título
              buttons:
                - bold
                - italic
              save_html: true
          -
            handle: marca_imagen_logo
            field:
              type: assets
              display: 'Imagen logo'
              max_files: 1
              container: assets
          -
            handle: marca_imagen_personajes
            field:
              type: assets
              display: 'Imagen personajes'
              max_files: 1
              container: assets
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
